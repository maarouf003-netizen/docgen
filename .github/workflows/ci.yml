name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # مهلة صريحة: شبكة أمان ضد أي تعليق مستقبلي بدل حجب المجموعة ساعات بصمت.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # -warnaserror: يكمل خواص Directory.Build.props — تحذيرات تقييم المشروع المبكرة
      # من محرك MSBuild (نحو MSB4011) لا تُرقّيها MSBuildTreatWarningsAsErrors (مُدحَض)،
      # وهذا المفتاح يرقّيها على مستوى المحرك (مُدحَض أيضًا: warning ← error).
      - name: Build (backend)
        run: dotnet build backend/DocGenerator.sln --nologo -v q -warnaserror
      # `-v q` يخص MSBuild فقط ويكتم تفاصيل فشل الاختبارات (رسالة/تتبّع)؛
      # `--logger console;verbosity=normal` يعيدها مع إبقاء البناء صامتًا.
      - name: Test (application)
        run: dotnet test backend/tests/DocGenerator.Application.Tests/DocGenerator.Application.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal"
      # عزل إجباري عن التوازي: فئة EnricherMiddlewareTests (Trait Category=Sequential)
      # تستبدل Log.Logger العام للعملية، وأي إقلاع ApiFactory في خيط موازٍ يستبدله
      # فيضيع حدث المسبار (فشل عابر). تُشغَّل الفئة تسلسليًا وحدها بعد البقية —
      # كما تنص remarks الفئة نفسها (كانت موثقة بلا إنفاذ، فكان الـflake حتميًا).
      - name: Test (api, parallelizable)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal" --filter "Category!=Sequential"
      - name: Test (api, sequential)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal" --filter "Category=Sequential"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # شجرة الاعتماديات المثبتة (jsdom 30 + undici 8) تتطلب Node ≥ 22 وقت التشغيل —
      # التثبيت على 20 يُسقط كل ملفات vitest بخطأ `markAsUncloneable` ( undici/jsdom ).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx oxlint src
      - name: Typecheck
        run: npx tsc -b
      - name: Test (frontend)
        run: npx vitest run
      - name: Build
        run: npm run build

  # حراس انحدار خطة رئيس الشعبة (المرحلة 9 — بند 4): يفشل عند أي تضييق
  # منسي (نداء محامين بلا mode، فحص head منفرد، سمة بلا subhead).
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: SubHead regression guards
        run: node scripts/subhead-guards.mjs

  # فحص الاعتماديات حاجب للدمج (RF-002 — شُدِّد بعد تثبيت خط الأساس الأخضر في RF-001).
  # فحص Snyk الكامل يتطلب سر `SNYK_TOKEN` في أسرار المستودع ثم يُضاف هنا (مهمة المالك).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet vulnerable packages
        run: dotnet list backend/DocGenerator.sln package --vulnerable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high

  # حارس سكربت هجرات Postgres (FR-001/FR-002): توليد غير متصل + منع أنواع SQL-Server
  # (`datetime2` وأخواتها) في DDL قبل أن تصل أي قاعدة. لا يتصل بأي قاعدة —
  # سلسلة الاتصال الوهمية لتلبية مصنع وقت التصميم فقط.
  migration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # مثبت برقم دقيق: الأحدث (11.x) يتطلب Runtime أحدث ويفشل على SDK ‏10 — ‏الرئيسي يجب أن يطابق الـSDK.
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: Restore (EF tool does not restore implicitly)
        run: dotnet restore backend/DocGenerator.sln
      # G1 دائم بدل فحص يدوي: يفشل إن تغيّر النموذج بلا هجرة مطابقة (exit 1).
      # سياق SQLite يبني المضيف زمن التصميم، وProgram.cs يرفض SQLite خارج Development —
      # لذلك Development هنا فقط؛ لا اتصال بقاعدة في هذا الأمر.
      # Jwt__Secret وهمي (42 حرفًا): Program.cs يتحقق من طول السر عند الإقلاع حتى في
      # Development، بلا قيمة افتراضية في المستودع. ليس سرًا حقيقيًا ولا يُستخدم لأي مصادقة.
      - name: SQLite model matches snapshot (G1)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Data Source=/tmp/migration-guard.db"
          Database__AutoMigrate: "false"
          Jwt__Secret: "ci-migration-guard-dummy-secret-0123456789"
        run: export PATH="$PATH:$HOME/.dotnet/tools"; dotnet ef migrations has-pending-model-changes --context DocGeneratorDbContext --project backend/src/DocGenerator.Infrastructure --startup-project backend/src/DocGenerator.Api
      # سياق Postgres يستخدم مصنعاً زمن التصميم يقرأ POSTGRES_CONNECTION حصراً (بلا اتصال).
      - name: Postgres model matches snapshot (G1)
        env:
          POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=docgen;Username=x;Password=x"
        run: export PATH="$PATH:$HOME/.dotnet/tools"; dotnet ef migrations has-pending-model-changes --context DocGeneratorPostgresDbContext --project backend/src/DocGenerator.Infrastructure --startup-project backend/src/DocGenerator.Api
      - name: Generate Postgres migration script (offline)
        env:
          POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=docgen;Username=x;Password=x"
        run: export PATH="$PATH:$HOME/.dotnet/tools"; dotnet ef migrations script --context DocGeneratorPostgresDbContext --project backend/src/DocGenerator.Infrastructure --startup-project backend/src/DocGenerator.Api -o /tmp/pg_migrations.sql
      - name: Forbid SQL-Server-only types in Postgres DDL
        run: |
          if grep -qi 'datetime2' /tmp/pg_migrations.sql; then
            echo "FORBIDDEN: 'datetime2' in Postgres migration script (see FR-001)"; exit 1;
          fi

  # اختبارات البوابة الحية لـ Postgres (FR-002): الاختبارات المبوبة بـ
  # DOCGEN_TEST_POSTGRES (مهاجرة + مسح) تعمل هنا فعليًا بدل تخطيها الصامت محليًا.
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DOCGEN_TEST_POSTGRES: "Host=localhost;Port=5432;Database=docgen_test;Username=postgres;Password=postgres"
      # يمنع «الخضرة الكاذبة»: غياب السلسلة أو تعذّر الاتصال = فشل صريح لا Skip.
      DOCGEN_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test (application, incl. Postgres-gated)
        run: dotnet test backend/tests/DocGenerator.Application.Tests/DocGenerator.Application.Tests.csproj --nologo -v q --logger "console;verbosity=normal"
      - name: Test (api, incl. Postgres-gated, parallelizable)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --nologo -v q --logger "console;verbosity=normal" --logger "trx;LogFileName=api-postgres.trx" --filter "Category!=Sequential"
      - name: Test (api, sequential)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal" --filter "Category=Sequential"
      - name: Assert Postgres summary projection test actually executed
        run: |
          trx=$(find . -name api-postgres.trx -print -quit)
          test -n "$trx"
          count=$(grep -o 'testName="[^"]*HeadAlertSummaryPostgresTests[^"]*"[^>]*outcome="Passed"' "$trx" | wc -l)
          echo "Passed HeadAlertSummaryPostgresTests: $count"
          test "$count" -gt 0
