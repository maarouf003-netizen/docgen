name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # مهلة صريحة وحدّ أعلى: التشغيل الموحد لـ Api.Tests كان يعلق ساعات بصمت
    # (~14 مصنع WebApplicationFactory متوازيًا يجمّد انتظار الدخول — مشخّص
    # بـ blame-hang على جهازين). لذا تُشغَّل Api على 4 دفعات مثبتة الخضرة
    # (تغطيتها الكاملة يفرضها scripts/api-shard-guard.mjs — لا إسقاط صامت).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Shard coverage guard
        run: node scripts/api-shard-guard.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build (backend)
        run: dotnet build backend/DocGenerator.sln --nologo -v q
      - name: Test (application)
        run: dotnet test backend/tests/DocGenerator.Application.Tests/DocGenerator.Application.Tests.csproj --no-build --nologo -v q
      - name: Test (api shard 1/5)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --filter 'FullyQualifiedName~RF007AuditScopeTests|FullyQualifiedName~ExecutionCircuits|FullyQualifiedName~DocumentsExportIntegrationTests|FullyQualifiedName~AppealForwardFlowTests|FullyQualifiedName~TransferIntegrationTests|FullyQualifiedName~TransferBranchGuardTests|FullyQualifiedName~RF004AuthzTests|FullyQualifiedName~SubHeadRolePermissionsTests'
      - name: Test (api shard 2a/5)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --filter 'FullyQualifiedName~DocumentsIntegrationTests|FullyQualifiedName~DelegationsIntegrationTests|FullyQualifiedName~DelegationPendingCountBranchGuardTests|FullyQualifiedName~AlertsIntegrationTests|FullyQualifiedName~EntityRegistry'
      - name: Test (api shard 2b/5, serialized)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --settings backend/tests/DocGenerator.Api.Tests/ci.serial.runsettings --filter 'FullyQualifiedName~DocumentScopeIsolationTests|FullyQualifiedName~DelegationScopeIsolationTests|FullyQualifiedName~CorrespondenceIntegrationTests|FullyQualifiedName~ReviewCorrespondenceScopeTests'
      - name: Test (api shard 3/5)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --filter 'FullyQualifiedName~StatisticsBranchGuardTests|FullyQualifiedName~StatisticsHeadScopeIntegrationTests|FullyQualifiedName~StatsScopeTests|FullyQualifiedName~ManagerStatsIntegrationTests|FullyQualifiedName~SectionsIntegrationTests|FullyQualifiedName~UserManagementIntegrationTests|FullyQualifiedName~UserBranchInvariantTests|FullyQualifiedName~BranchManagementIntegrationTests|FullyQualifiedName~AuthIntegrationTests|FullyQualifiedName~AuthControllerBranchRequiredTests|FullyQualifiedName~AuditIntegrationTests|FullyQualifiedName~AppSuggestionsIntegrationTests|FullyQualifiedName~PersonalRemindersIntegrationTests|FullyQualifiedName~WordGenerationIntegrationTests|FullyQualifiedName~ClientErrorsIntegrationTests'
      - name: Test (api shard 4/5)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --filter 'FullyQualifiedName~RF001|FullyQualifiedName~RF003AuthzProofTests|FullyQualifiedName~RF005SecurityLoggingTests|FullyQualifiedName~RF006PostgresFactoryTests|FullyQualifiedName~RF008SessionLifetimeTests|FullyQualifiedName~RF009NumberingTests|FullyQualifiedName~RF010ConcurrencyTests|FullyQualifiedName~RF011IdempotencyTests|FullyQualifiedName~RF016HealthTests|FullyQualifiedName~RF017SilentWriteAuditTests|FullyQualifiedName~RF018ReadAuditTests|FullyQualifiedName~RF019AppendOnlyTests|FullyQualifiedName~ClaimsPrincipalExtensionsTests|FullyQualifiedName~DatabaseInitializerTests|FullyQualifiedName~EnricherMiddlewareTests|FullyQualifiedName~EntityManagerPortalGuardTests|FullyQualifiedName~ExceptionHandlerIntegrationTests|FullyQualifiedName~ForwardedHeadersOptionsTests|FullyQualifiedName~GlobalExceptionHandlerTests|FullyQualifiedName~JwtSecretValidationTests|FullyQualifiedName~LockoutIntegrationTests|FullyQualifiedName~LogSanitizerTests|FullyQualifiedName~MetaControllerTests|FullyQualifiedName~MissingRoleClaimTests|FullyQualifiedName~PostgresConnectionStringTests|FullyQualifiedName~RateLimitingIntegrationTests|FullyQualifiedName~SecurityHeadersIntegrationTests|FullyQualifiedName~StaleRoleRevocationTests|FullyQualifiedName~SwaggerIntegrationTests|FullyQualifiedName~TokenRevocationIntegrationTests'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # شجرة الاعتماديات المثبتة (jsdom 30 + undici 8) تتطلب Node ≥ 22 وقت التشغيل —
      # التثبيت على 20 يُسقط كل ملفات vitest بخطأ `markAsUncloneable` ( undici/jsdom ).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx oxlint src
      - name: Typecheck
        run: npx tsc -b
      - name: Test (frontend)
        run: npx vitest run
      - name: Build
        run: npm run build

  # حراس انحدار خطة رئيس الشعبة (المرحلة 9 — بند 4): يفشل عند أي تضييق
  # منسي (نداء محامين بلا mode، فحص head منفرد، سمة بلا subhead).
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: SubHead regression guards
        run: node scripts/subhead-guards.mjs

  # فحص الاعتماديات حاجب للدمج (RF-002 — شُدِّد بعد تثبيت خط الأساس الأخضر في RF-001).
  # فحص Snyk الكامل يتطلب سر `SNYK_TOKEN` في أسرار المستودع ثم يُضاف هنا (مهمة المالك).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet vulnerable packages
        run: dotnet list backend/DocGenerator.sln package --vulnerable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high
