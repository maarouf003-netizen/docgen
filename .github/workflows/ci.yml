name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test (backend)
        run: dotnet test backend/DocGenerator.sln --nologo -v q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx oxlint src
      - name: Typecheck
        run: npx tsc -b
      - name: Test (frontend)
        run: npx vitest run
      - name: Build
        run: npm run build

  # فحص الاعتماديات إعلامي (لا يحجب الدمج): يُشدَّد لاحقًا بعد تثبيت خط الأساس.
  # فحص Snyk الكامل يتطلب سر `SNYK_TOKEN` في أسرار المستودع ثم يُضاف هنا.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet vulnerable packages
        run: dotnet list backend/DocGenerator.sln package --vulnerable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high
