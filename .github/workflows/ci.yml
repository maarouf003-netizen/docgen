name: CI

on:
  # فرع `master` فقط: دفعات فروع الميزات تُفحص عبر `pull_request` وحدها،
  # فلا تُشغَّل الدورة الكاملة مرتين لنفس الـcommit (push + PR synchronize).
  push:
    branches: [master]
  pull_request:
    branches: [master]

# دفعة جديدة على نفس الـPR تُلغي التشغيل السابق غير المكتمل.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    # مهلة صريحة: شبكة أمان ضد أي تعليق مستقبلي بدل حجب المجموعة ساعات بصمت.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # -warnaserror: يكمل خواص Directory.Build.props — تحذيرات تقييم المشروع المبكرة
      # من محرك MSBuild (نحو MSB4011) لا تُرقّيها MSBuildTreatWarningsAsErrors (مُدحَض)،
      # وهذا المفتاح يرقّيها على مستوى المحرك (مُدحَض أيضًا: warning ← error).
      # P4-06b: التحقق من أقفال الاعتماديات قبل البناء — يفشل عند أي انحراف بين
      # المشاريع وpackages.lock.json (ترقية بلا تحديث قفل = فشل صريح لا بناء مختلف).
      - name: Restore (locked)
        run: dotnet restore backend/DocGenerator.sln --locked-mode
      - name: Build (backend)
        run: dotnet build backend/DocGenerator.sln --no-restore --nologo -v q -warnaserror
      # P4-06: بوابة التنسيق — `dotnet format` الداخلي (بدون محلّلات خارجية).
      # البناء أعلاه يضمن وجود أصول الاستعادة، فيعمل `--no-restore` على CI بسرعة.
      # المسار الكامل للملف المفتاح: .editorconfig (charset=utf-8/eol=lf) + .gitattributes.
      - name: Format gate (dotnet format)
        run: dotnet format backend/DocGenerator.sln --verify-no-changes --no-restore
      # P1-06: بوابة حدود المعمارية — تفشل عند أي اعتماد بين الطبقات ممنوع،
      # أو استخدام DbContext في متحكم، أو raw SQL في Application.
      - name: Test (architecture boundaries)
        run: dotnet test backend/tests/DocGenerator.Architecture.Tests/DocGenerator.Architecture.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal"
      # P1-08/8c (ADR-0009): لا مزوّد `SQLite` في الاختبارات — كل اختبارات القاعدة
      # (Application + Api) تعمل على `PostgreSQL` حقيقي في وظيفة `backend-postgres`
      # مع `DOCGEN_REQUIRE_POSTGRES=1`، فلا تُكرَّر هنا بتخطٍّ صامت.

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # شجرة الاعتماديات المثبتة (jsdom 30 + undici 8) تتطلب Node ≥ 22 وقت التشغيل —
      # التثبيت على 20 يُسقط كل ملفات vitest بخطأ `markAsUncloneable` ( undici/jsdom ).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Lint
        # يشمل `scripts` لأن حارس CSP نفسه كود يُنشر في الصورة —
        # ولا يُترك خارج الفحص.
        run: npx oxlint src scripts
      - name: Typecheck
        run: npx tsc -b
      - name: Test (frontend)
        run: npx vitest run
      - name: Build
        run: npm run build
      # P6-05: سقوف الحزمة (إجمالي/أكبر حزمة/الدخول) — تفشل عند أي قفزة غير مقصودة.
      - name: Bundle budget
        run: npm run budget
      # P6-06: الأنواع المولَّدة من لقطة OpenAPI يجب أن تكون مطابقة لها. توليد مختلف
      # عن الملف المتتبَّع = إما لقطة لم تُحدَّث بعد تغيير API أو تعديل يدوي للأنواع.
      - name: Generated API types are current
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated.ts
      # W0-CSP: فحص مخرجات Vite ضد السياسة المفروضة (سكربتات/معالجات مضمّنة، أصول خارجية،
      # eval/Function/WebAssembly). يفشل هنا لا في المتصفح بعد النشر.
      - name: CSP static guard (built dist)
        run: npm run guard

  # حراس انحدار خطة رئيس الشعبة (المرحلة 9 — بند 4): يفشل عند أي تضييق
  # منسي (نداء محامين بلا mode، فحص head منفرد، سمة بلا subhead).
  guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: SubHead regression guards
        run: node scripts/subhead-guards.mjs
      # P1-02: ratchet يمنع إدخال DateTime.Now/Today أو Random غير محقون،
      # ويُفشل خط الأساس القديم حتى يُقلَّص بعد الإصلاح.
      - name: Determinism guard
        run: node scripts/determinism-guard.mjs
      # P7-02a: كل هجرة في MigrationsPostgres يجب أن تكون مسجّلة في RUN_GUIDE.md §9
      # وAGENTS.md؛ النسيان يعني رفض إقلاع في الإنتاج (AutoMigrate=false).
      - name: Migration watchlist guard
        run: node scripts/migration-watchlist-guard.mjs
      # P5-05a: يمنع عمليات الهدم (Drop/Alter/Rename/DeleteData) في `Up` بلا استثناء
      # موثّق — قرار expand/contract لا يمرّ صامتًا إلى قاعدة الإنتاج.
      - name: Migration safety guard
        run: node scripts/migration-safety-guard.mjs
      # P2-05: يمنع دخول أسرار (مفاتيح/رموز/سلاسل اتصال بكلمات مرور) إلى الملفات
      # المتتبَّعة؛ خط الأساس يسمح بقيم الاختبار الموثّقة فقط، ولا تُطبع القيم أبدًا.
      - name: Secrets guard
        run: node scripts/secrets-guard.mjs
      # P5-02: يتحقق من صلاحية YAML/JSON لملفات الرصد، ومن اتساق SLO/التنبيهات/
      # الدليل (روابط runbook، تغطية كل تنبيه، أسماء مقاييس موثّقة) بلا أي حزمة جديدة.
      - name: Observability config guard
        run: node scripts/observability-config-guard.mjs --self-test
      # P5-06: أعلام أمان النسخ/الاستعادة (dry-run، تأكيد، حارس إنتاج، بصمة) + تحقق
      # من الدليل/الخريطة، وتشغيل الاختبارات الذاتية للسكربتات الستة فعليًا (bash/pwsh).
      - name: Backup/restore scripts guard
        run: node scripts/backup/backup-scripts-guard.mjs --self-test
      # P1-01i/c: اختبار ذاتي لحارس مجموعات PostgreSQL (اكتشاف من المصدر + تحقق trx)
      # يعمل في وظيفة لا تحتاج .NET، فلا يمرّ تعديل على المحلل بلا برهان.
      - name: PostgreSQL suite guard self-test
        run: node scripts/postgres-suite-guard.mjs --self-test

  # فحص الاعتماديات حاجب للدمج (RF-002 — شُدِّد بعد تثبيت خط الأساس الأخضر في RF-001).
  # فحص Snyk الكامل يتطلب سر `SNYK_TOKEN` في أسرار المستودع ثم يُضاف هنا (مهمة المالك).
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # P4-06b: `dotnet list package` يُعيد التهيئة تلقائيًا؛ نتحقق من الأقفال أولًا
      # حتى لا تنحرف في وظيفة الفحص دون أن يلاحظها أحد.
      - name: Restore (locked)
        run: dotnet restore backend/DocGenerator.sln --locked-mode
      # P2-06: `dotnet list package --vulnerable` وحده يُرجع رمز خروج 0 حتى مع الثغرات،
      # فالسكربت يقرأ JSON ويُفشل عند High/Critical (fail-closed لشدّة غير معروفة).
      - name: Self-test dependency gate parser
        run: node scripts/dependency-audit.mjs --self-test
      - name: Dependency gate (High/Critical)
        run: node scripts/dependency-audit.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Self-test npm audit guard
        run: node scripts/npm-audit-guard.mjs --self-test
      # P2-06: بوابة npm audit بدل `npm audit --audit-level=high` الخام: تفشل على أي
      # High/Critical غير مستثنى، وتقبل استثناءً مؤقتًا مبرّرًا بتاريخ انتهاء فقط
      # (للثغرات التي لا إصدار مُصلَح لها بعد)، وتفشل إذا انتهى/صار قديمًا.
      - name: npm audit (high+, documented exceptions only)
        run: node scripts/npm-audit-guard.mjs
      # P2-06: SBOM (CycloneDX) لكل من الخلفية والواجهة، يُرفع كأثر للمراجعة
      # (لا بوابة عتبة؛ الهدف توفّر جرد اعتماديات لكل إصدار).
      - name: SBOM (.NET, CycloneDX)
        run: |
          mkdir -p artifacts/sbom
          dotnet tool install --global CycloneDX --version 6.3.1
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX backend/DocGenerator.sln -o artifacts/sbom -fn backend-bom.json -F Json -t
      # cyclonedx-npm يبني الشجرة عبر `npm ls`، فالمطلوب تثبيت مطابق للقفل أولًا
      # (`npm ci`) — وهو بذاته تحقق من أن القفل قابل لإعادة الإنتاج.
      - name: Install frontend dependencies (for SBOM)
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      # P6-06: قفل الواجهة يحمل openapi-typescript بpeer `typescript ^5.x` (والمشروع 6)،
      # فيخرج `npm ls` بـ`ELSPROBLEMS invalid: typescript` ويفشل cyclonedx. العلم
      # `--ignore-npm-errors` يسمح بتوليد SBOM رغم تحذير peer معروف؛ SBOM أثر لا بوابة.
      - name: SBOM (frontend, CycloneDX)
        working-directory: frontend
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.1 --ignore-npm-errors --output-file ../artifacts/sbom/frontend-bom.json --output-format JSON
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: artifacts/sbom
          retention-days: 30

  # حارس سكربت هجرات Postgres (FR-001/FR-002): توليد غير متصل + منع أنواع SQL-Server
  # (`datetime2` وأخواتها) في DDL قبل أن تصل أي قاعدة. لا يتصل بأي قاعدة —
  # سلسلة الاتصال الوهمية لتلبية مصنع وقت التصميم فقط.
  migration-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # مثبت برقم دقيق: الأحدث (11.x) يتطلب Runtime أحدث ويفشل على SDK ‏10 — ‏الرئيسي يجب أن يطابق الـSDK.
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: Restore (locked)
        run: dotnet restore backend/DocGenerator.sln --locked-mode
      # G1 دائم بدل فحص يدوي: يفشل إن تغيّر النموذج بلا هجرة مطابقة (exit 1).
      # ADR-0001: PostgreSQL هو المزوّد الوحيد في التشغيل؛ لا فحص لسياق SQLite.
      # سياق Postgres يستخدم مصنعاً زمن التصميم يقرأ POSTGRES_CONNECTION حصراً (بلا اتصال).
      - name: Postgres model matches snapshot (G1)
        env:
          POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=docgen;Username=x;Password=x"
        run: export PATH="$PATH:$HOME/.dotnet/tools"; dotnet ef migrations has-pending-model-changes --context DocGeneratorPostgresDbContext --project backend/src/DocGenerator.Infrastructure --startup-project backend/src/DocGenerator.Api
      - name: Generate Postgres migration script (offline)
        env:
          POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=docgen;Username=x;Password=x"
        run: export PATH="$PATH:$HOME/.dotnet/tools"; dotnet ef migrations script --context DocGeneratorPostgresDbContext --project backend/src/DocGenerator.Infrastructure --startup-project backend/src/DocGenerator.Api -o /tmp/pg_migrations.sql
      - name: Forbid SQL-Server-only types in Postgres DDL
        run: |
          if grep -qi 'datetime2' /tmp/pg_migrations.sql; then
            echo "FORBIDDEN: 'datetime2' in Postgres migration script (see FR-001)"; exit 1;
          fi
      # P5-05b: أثر DDL للمراجعة قبل النشر — سكربت idempotent كامل (بلا اتصال بقاعدة).
      # يُرفع مع كل تشغيل كي يراجع المالك/المراجع SQL الفعلي لا وصف الهجرة.
      - name: Generate idempotent Postgres script (review artifact)
        env:
          POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=docgen;Username=x;Password=x"
        run: |
          mkdir -p artifacts/migrations
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent --context DocGeneratorPostgresDbContext --project backend/src/DocGenerator.Infrastructure --startup-project backend/src/DocGenerator.Api -o artifacts/migrations/pg-idempotent.sql
      - name: Upload migration SQL artifact
        uses: actions/upload-artifact@v7
        with:
          name: migrations-sql
          path: artifacts/migrations
          retention-days: 30

  # اختبارات البوابة الحية لـ Postgres (FR-002): الاختبارات المبوبة بـ
  # DOCGEN_TEST_POSTGRES (مهاجرة + مسح) تعمل هنا فعليًا بدل تخطيها الصامت محليًا.
  backend-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        # P7-05: مطابقة إصدار القياس/الإنتاج (PostgreSQL 16) بدل 15؛ كانت اللقطة
        # `docs/audit/82` تفترض 16 بينما الـCI على 15 — صُحّح هنا.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DOCGEN_TEST_POSTGRES: "Host=localhost;Port=5432;Database=docgen_test;Username=postgres;Password=postgres"
      # يمنع «الخضرة الكاذبة»: غياب السلسلة أو تعذّر الاتصال = فشل صريح لا Skip.
      DOCGEN_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # P4-06b: نفس التحقق من الأقفال في وظيفة Postgres كي لا يمرّ انحراف هنا.
      - name: Restore (locked)
        run: dotnet restore backend/DocGenerator.sln --locked-mode
      - name: Test (application, incl. Postgres-gated)
        run: dotnet test backend/tests/DocGenerator.Application.Tests/DocGenerator.Application.Tests.csproj --nologo -v q --logger "console;verbosity=normal" --logger "trx;LogFileName=app-postgres.trx" --blame-hang --blame-hang-timeout 25m --blame-hang-dump-type none --collect:"XPlat Code Coverage"
      # P1-08 (ADR-0009): في وضع CI تُنفَّذ اختبارات Application على Postgres فعليًا،
      # فلا يُقبل تخطٍّ صامت (PostgresFact يتخطى محليًا فقط عند غياب السلسلة).
      - name: Assert no skipped Application tests on PostgreSQL
        run: |
          trx=$(find . -name app-postgres.trx -print -quit)
          test -n "$trx"
          skipped=$(grep -o 'outcome="NotExecuted"' "$trx" | wc -l)
          echo "Skipped Application tests: $skipped"
          test "$skipped" -eq 0
      - name: Test (api, incl. Postgres-gated, parallelizable)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --nologo -v q --logger "console;verbosity=normal" --logger "trx;LogFileName=api-postgres.trx" --filter "Category!=Sequential" --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none --collect:"XPlat Code Coverage"
      - name: Test (api, sequential)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal" --filter "Category=Sequential"
      - name: Assert Postgres summary projection test actually executed
        run: |
          trx=$(find . -name api-postgres.trx -print -quit)
          test -n "$trx"
          count=$(grep -o 'testName="[^"]*HeadAlertSummaryPostgresTests[^"]*"[^>]*outcome="Passed"' "$trx" | wc -l)
          echo "Passed HeadAlertSummaryPostgresTests: $count"
          test "$count" -gt 0
      # P1-01i/c: الاكتشاف من المصدر (لا قائمة يدوية) — أي مجموعة PostgreSQL جديدة
      # تدخل الحارس تلقائيًا، وأي غياب تنفيذ أو تخطٍّ صامت يُفشل الوظيفة.
      - name: Assert every PostgreSQL suite actually executed
        run: |
          trx=$(find . -name api-postgres.trx -print -quit)
          test -n "$trx"
          node scripts/postgres-suite-guard.mjs "$trx"
      # P7-02b: تطبيق الهجرات على قاعدة الفحص ثم مقارنة __EFMigrationsHistory بالملفات.
      # يفشل عند هجرة معلّقة أو انحراف تاريخ — لا يكفي حارس التوثيق (P7-02a).
      - name: Install dotnet-ef (migration history check)
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Apply migrations to the history-check database
        run: |
          export POSTGRES_CONNECTION="$DOCGEN_TEST_POSTGRES"
          dotnet ef database update --context DocGeneratorPostgresDbContext \
            --project backend/src/DocGenerator.Infrastructure/DocGenerator.Infrastructure.csproj \
            --startup-project backend/src/DocGenerator.Api/DocGenerator.Api.csproj \
            --connection "$DOCGEN_TEST_POSTGRES" --no-build
      - name: Assert database history matches migration files
        run: node scripts/migration-history-check.mjs
      # تقرير التغطية إعلامي: يُرفع كأثر للتنزيل والمراجعة، ولا يفشل البناء عند انخفاضه.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

  # P6-04: بوابة E2E الإضافية — Playwright (تدفقات حرجة) + axe (إمكانية وصول)
  # + فحص تجاوز 375px، على قاعدة PostgreSQL 16 مؤقتة تُنشأ لهذا التشغيل فقط.
  # الحارس `frontend/scripts/e2e-safety-guard.mjs` يرفض أي هدف غير محلي/غير staging
  # وأي قاعدة لا يحتوي اسمها على `e2e`، فلا يمكن توجيه البوابة إلى الإنتاج.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      E2E_MANAGED_SERVERS: "1"
      E2E_BASE_URL: "http://127.0.0.1:5173"
      E2E_API_URL: "http://127.0.0.1:5080"
      # CI يستخدم Chromium المثبَّت بالإصدار (لا Chrome المستضيف) — حتمية الرسم.
      E2E_BROWSER_CHANNEL: "chromium"
      # قاعدة مؤقتة مخصّصة (اسمها يحتوي e2e). كلمة المرور قيمة خدمة محلية غير سرّية.
      E2E_DB_CONNECTION: "Host=localhost;Port=5432;Database=docgen_e2e;Username=postgres;Password=postgres"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      # نفس تحقق الأقفال في بقية الوظائف — لا بناء مختلفًا في بوابة E2E.
      - name: Restore (locked)
        run: dotnet restore backend/DocGenerator.sln --locked-mode
      # `--no-build` في webServer يتطلب مخرجات بناء مسبقة.
      - name: Build backend
        run: dotnet build backend/DocGenerator.sln --no-restore --nologo -v q --warnaserror
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      # قاعدة `docgen_e2e` تُنشأ تلقائيًا عند تطبيق الهجرات (EF) — لا EnsureCreated.
      # مصنع زمن التصميم (`PostgresDbContextFactory`) يشترط POSTGRES_CONNECTION حتى مع
      # `--connection`، فنُصدّره من سلسلة E2E نفسها قبل الأمر.
      - name: Migrate the disposable E2E database
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          export POSTGRES_CONNECTION="$E2E_DB_CONNECTION"
          dotnet ef database update --context DocGeneratorPostgresDbContext \
            --project backend/src/DocGenerator.Infrastructure/DocGenerator.Infrastructure.csproj \
            --startup-project backend/src/DocGenerator.Api/DocGenerator.Api.csproj \
            --connection "$E2E_DB_CONNECTION" --no-build
      # عميل psql غير مضمون في صورة الـrunner؛ تثبيته يجعل البذر حتميًا.
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Seed deterministic E2E data
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -p 5432 -U postgres -d docgen_e2e -v ON_ERROR_STOP=1 -f scripts/e2e/seed.sql
      - name: Install Playwright (pinned Chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Lint E2E sources
        working-directory: frontend
        run: npx oxlint e2e playwright.config.ts scripts/e2e-safety-guard.mjs scripts/e2e-browser-smoke.mjs
      # اختبار ذاتي لحارس السلامة قبل أي متصفح: إثبات أن قواعد «محلي/قاعدة e2e» تعمل.
      - name: E2E safety guard self-test
        working-directory: frontend
        run: node scripts/e2e-safety-guard.mjs --self-test
      - name: Run Playwright (E2E + axe + 375px)
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
