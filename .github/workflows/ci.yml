name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # مهلة صريحة: شبكة أمان ضد أي تعليق مستقبلي بدل حجب المجموعة ساعات بصمت.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # -warnaserror: يكمل خواص Directory.Build.props — تحذيرات تقييم المشروع المبكرة
      # من محرك MSBuild (نحو MSB4011) لا تُرقّيها MSBuildTreatWarningsAsErrors (مُدحَض)،
      # وهذا المفتاح يرقّيها على مستوى المحرك (مُدحَض أيضًا: warning ← error).
      # P4-06b: التحقق من أقفال الاعتماديات قبل البناء — يفشل عند أي انحراف بين
      # المشاريع وpackages.lock.json (ترقية بلا تحديث قفل = فشل صريح لا بناء مختلف).
      - name: Restore (locked)
        run: dotnet restore backend/DocGenerator.sln --locked-mode
      - name: Build (backend)
        run: dotnet build backend/DocGenerator.sln --no-restore --nologo -v q -warnaserror
      # P4-06: بوابة التنسيق — `dotnet format` الداخلي (بدون محلّلات خارجية).
      # البناء أعلاه يضمن وجود أصول الاستعادة، فيعمل `--no-restore` على CI بسرعة.
      # المسار الكامل للملف المفتاح: .editorconfig (charset=utf-8/eol=lf) + .gitattributes.
      - name: Format gate (dotnet format)
        run: dotnet format backend/DocGenerator.sln --verify-no-changes --no-restore
      # P1-06: بوابة حدود المعمارية — تفشل عند أي اعتماد بين الطبقات ممنوع،
      # أو استخدام DbContext في متحكم، أو raw SQL في Application.
      - name: Test (architecture boundaries)
        run: dotnet test backend/tests/DocGenerator.Architecture.Tests/DocGenerator.Architecture.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal"
      # `-v q` يخص MSBuild فقط ويكتم تفاصيل فشل الاختبارات (رسالة/تتبّع)؛
      # `--logger console;verbosity=normal` يعيدها مع إبقاء البناء صامتًا.
      #
      # P1-07: `--blame-hang` يحوّل أي تعليق إلى فشل سريع مع ملف تسلسل يحدد آخر
      # الاختبارات الجارية، بدل احتجاز الوظيفة حتى مهلة الـjob. `dump-type none`
      # لأن الغرض تحديد الموضع لا تفريغ ذاكرة ضخم.
      # `--collect:"XPlat Code Coverage"` تقرير تغطية إعلامي (لا بوابة 100%).
      - name: Test (application)
        run: dotnet test backend/tests/DocGenerator.Application.Tests/DocGenerator.Application.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal" --blame-hang --blame-hang-timeout 25m --blame-hang-dump-type none --collect:"XPlat Code Coverage"
      # عزل إجباري عن التوازي: فئة EnricherMiddlewareTests (Trait Category=Sequential)
      # تستبدل Log.Logger العام للعملية، وأي إقلاع ApiFactory في خيط موازٍ يستبدله
      # فيضيع حدث المسبار (فشل عابر). تُشغَّل الفئة تسلسليًا وحدها بعد البقية —
      # كما تنص remarks الفئة نفسها (كانت موثقة بلا إنفاذ، فكان الـflake حتميًا).
      - name: Test (api, parallelizable)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal" --filter "Category!=Sequential" --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none --collect:"XPlat Code Coverage"
      - name: Test (api, sequential)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal" --filter "Category=Sequential"
      # تقرير التغطية إعلامي: يُرفع كأثر للتنزيل والمراجعة، ولا يفشل البناء عند انخفاضه.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/tests/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # شجرة الاعتماديات المثبتة (jsdom 30 + undici 8) تتطلب Node ≥ 22 وقت التشغيل —
      # التثبيت على 20 يُسقط كل ملفات vitest بخطأ `markAsUncloneable` ( undici/jsdom ).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        # يشمل `scripts` لأن حارس CSP نفسه كود يُنشر في الصورة —
        # ولا يُترك خارج الفحص.
        run: npx oxlint src scripts
      - name: Typecheck
        run: npx tsc -b
      - name: Test (frontend)
        run: npx vitest run
      - name: Build
        run: npm run build
      # W0-CSP: فحص مخرجات Vite ضد السياسة المفروضة (سكربتات/معالجات مضمّنة، أصول خارجية،
      # eval/Function/WebAssembly). يفشل هنا لا في المتصفح بعد النشر.
      - name: CSP static guard (built dist)
        run: npm run guard

  # حراس انحدار خطة رئيس الشعبة (المرحلة 9 — بند 4): يفشل عند أي تضييق
  # منسي (نداء محامين بلا mode، فحص head منفرد، سمة بلا subhead).
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: SubHead regression guards
        run: node scripts/subhead-guards.mjs
      # P1-02: ratchet يمنع إدخال DateTime.Now/Today أو Random غير محقون،
      # ويُفشل خط الأساس القديم حتى يُقلَّص بعد الإصلاح.
      - name: Determinism guard
        run: node scripts/determinism-guard.mjs
      # P7-02a: كل هجرة في MigrationsPostgres يجب أن تكون مسجّلة في RUN_GUIDE.md §9
      # وAGENTS.md؛ النسيان يعني رفض إقلاع في الإنتاج (AutoMigrate=false).
      - name: Migration watchlist guard
        run: node scripts/migration-watchlist-guard.mjs
      # P5-05a: يمنع عمليات الهدم (Drop/Alter/Rename/DeleteData) في `Up` بلا استثناء
      # موثّق — قرار expand/contract لا يمرّ صامتًا إلى قاعدة الإنتاج.
      - name: Migration safety guard
        run: node scripts/migration-safety-guard.mjs
      # P2-05: يمنع دخول أسرار (مفاتيح/رموز/سلاسل اتصال بكلمات مرور) إلى الملفات
      # المتتبَّعة؛ خط الأساس يسمح بقيم الاختبار الموثّقة فقط، ولا تُطبع القيم أبدًا.
      - name: Secrets guard
        run: node scripts/secrets-guard.mjs

  # فحص الاعتماديات حاجب للدمج (RF-002 — شُدِّد بعد تثبيت خط الأساس الأخضر في RF-001).
  # فحص Snyk الكامل يتطلب سر `SNYK_TOKEN` في أسرار المستودع ثم يُضاف هنا (مهمة المالك).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # P4-06b: `dotnet list package` يُعيد التهيئة تلقائيًا؛ نتحقق من الأقفال أولًا
      # حتى لا تنحرف في وظيفة الفحص دون أن يلاحظها أحد.
      - name: Restore (locked)
        run: dotnet restore backend/DocGenerator.sln --locked-mode
      # P2-06: `dotnet list package --vulnerable` وحده يُرجع رمز خروج 0 حتى مع الثغرات،
      # فالسكربت يقرأ JSON ويُفشل عند High/Critical (fail-closed لشدّة غير معروفة).
      - name: Self-test dependency gate parser
        run: node scripts/dependency-audit.mjs --self-test
      - name: Dependency gate (High/Critical)
        run: node scripts/dependency-audit.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high
      # P2-06: SBOM (CycloneDX) لكل من الخلفية والواجهة، يُرفع كأثر للمراجعة
      # (لا بوابة عتبة؛ الهدف توفّر جرد اعتماديات لكل إصدار).
      - name: SBOM (.NET, CycloneDX)
        run: |
          mkdir -p artifacts/sbom
          dotnet tool install --global CycloneDX --version 6.3.1
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet CycloneDX backend/DocGenerator.sln -o artifacts/sbom -fn backend-bom.json -F Json -t
      # cyclonedx-npm يبني الشجرة عبر `npm ls`، فالمطلوب تثبيت مطابق للقفل أولًا
      # (`npm ci`) — وهو بذاته تحقق من أن القفل قابل لإعادة الإنتاج.
      - name: Install frontend dependencies (for SBOM)
        working-directory: frontend
        run: npm ci
      - name: SBOM (frontend, CycloneDX)
        working-directory: frontend
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.1 --output-file ../artifacts/sbom/frontend-bom.json --output-format JSON
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom
          retention-days: 30

  # حارس سكربت هجرات Postgres (FR-001/FR-002): توليد غير متصل + منع أنواع SQL-Server
  # (`datetime2` وأخواتها) في DDL قبل أن تصل أي قاعدة. لا يتصل بأي قاعدة —
  # سلسلة الاتصال الوهمية لتلبية مصنع وقت التصميم فقط.
  migration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # مثبت برقم دقيق: الأحدث (11.x) يتطلب Runtime أحدث ويفشل على SDK ‏10 — ‏الرئيسي يجب أن يطابق الـSDK.
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: Restore (locked)
        run: dotnet restore backend/DocGenerator.sln --locked-mode
      # G1 دائم بدل فحص يدوي: يفشل إن تغيّر النموذج بلا هجرة مطابقة (exit 1).
      # ADR-0001: PostgreSQL هو المزوّد الوحيد في التشغيل؛ لا فحص لسياق SQLite.
      # سياق Postgres يستخدم مصنعاً زمن التصميم يقرأ POSTGRES_CONNECTION حصراً (بلا اتصال).
      - name: Postgres model matches snapshot (G1)
        env:
          POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=docgen;Username=x;Password=x"
        run: export PATH="$PATH:$HOME/.dotnet/tools"; dotnet ef migrations has-pending-model-changes --context DocGeneratorPostgresDbContext --project backend/src/DocGenerator.Infrastructure --startup-project backend/src/DocGenerator.Api
      - name: Generate Postgres migration script (offline)
        env:
          POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=docgen;Username=x;Password=x"
        run: export PATH="$PATH:$HOME/.dotnet/tools"; dotnet ef migrations script --context DocGeneratorPostgresDbContext --project backend/src/DocGenerator.Infrastructure --startup-project backend/src/DocGenerator.Api -o /tmp/pg_migrations.sql
      - name: Forbid SQL-Server-only types in Postgres DDL
        run: |
          if grep -qi 'datetime2' /tmp/pg_migrations.sql; then
            echo "FORBIDDEN: 'datetime2' in Postgres migration script (see FR-001)"; exit 1;
          fi
      # P5-05b: أثر DDL للمراجعة قبل النشر — سكربت idempotent كامل (بلا اتصال بقاعدة).
      # يُرفع مع كل تشغيل كي يراجع المالك/المراجع SQL الفعلي لا وصف الهجرة.
      - name: Generate idempotent Postgres script (review artifact)
        env:
          POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=docgen;Username=x;Password=x"
        run: |
          mkdir -p artifacts/migrations
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent --context DocGeneratorPostgresDbContext --project backend/src/DocGenerator.Infrastructure --startup-project backend/src/DocGenerator.Api -o artifacts/migrations/pg-idempotent.sql
      - name: Upload migration SQL artifact
        uses: actions/upload-artifact@v4
        with:
          name: migrations-sql
          path: artifacts/migrations
          retention-days: 30

  # اختبارات البوابة الحية لـ Postgres (FR-002): الاختبارات المبوبة بـ
  # DOCGEN_TEST_POSTGRES (مهاجرة + مسح) تعمل هنا فعليًا بدل تخطيها الصامت محليًا.
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DOCGEN_TEST_POSTGRES: "Host=localhost;Port=5432;Database=docgen_test;Username=postgres;Password=postgres"
      # يمنع «الخضرة الكاذبة»: غياب السلسلة أو تعذّر الاتصال = فشل صريح لا Skip.
      DOCGEN_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # P4-06b: نفس التحقق من الأقفال في وظيفة Postgres كي لا يمرّ انحراف هنا.
      - name: Restore (locked)
        run: dotnet restore backend/DocGenerator.sln --locked-mode
      - name: Test (application, incl. Postgres-gated)
        run: dotnet test backend/tests/DocGenerator.Application.Tests/DocGenerator.Application.Tests.csproj --nologo -v q --logger "console;verbosity=normal" --blame-hang --blame-hang-timeout 25m --blame-hang-dump-type none
      - name: Test (api, incl. Postgres-gated, parallelizable)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --nologo -v q --logger "console;verbosity=normal" --logger "trx;LogFileName=api-postgres.trx" --filter "Category!=Sequential" --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none
      - name: Test (api, sequential)
        run: dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj --no-build --nologo -v q --logger "console;verbosity=normal" --filter "Category=Sequential"
      - name: Assert Postgres summary projection test actually executed
        run: |
          trx=$(find . -name api-postgres.trx -print -quit)
          test -n "$trx"
          count=$(grep -o 'testName="[^"]*HeadAlertSummaryPostgresTests[^"]*"[^>]*outcome="Passed"' "$trx" | wc -l)
          echo "Passed HeadAlertSummaryPostgresTests: $count"
          test "$count" -gt 0
