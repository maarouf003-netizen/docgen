name: Flake sentinel (P1-02)

# إثبات DoD «20 تشغيلًا متتاليًا بلا flake» دون إبطاء كل PR:
# يدوي عند الحاجة + مجدول أسبوعيًا. الفشل هنا لا يحجب الدمج، لكنه يفتح تحقيقًا.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "عدد التشغيلات المتتالية للمجموعتين (Application + Api)"
        required: true
        default: "20"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/DocGenerator.sln

      - name: Build
        run: dotnet build backend/DocGenerator.sln --nologo -v q -warnaserror

      - name: Repeat application + api suites
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '20' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Flake sentinel — ${ITERATIONS} run(s)" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::Run ${i}/${ITERATIONS}"
            start=$(date +%s)

            dotnet test backend/tests/DocGenerator.Application.Tests/DocGenerator.Application.Tests.csproj \
              --no-build --nologo -v q --logger "console;verbosity=minimal"

            dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj \
              --no-build --nologo -v q --logger "console;verbosity=minimal" \
              --filter "Category!=Sequential"

            dotnet test backend/tests/DocGenerator.Api.Tests/DocGenerator.Api.Tests.csproj \
              --no-build --nologo -v q --logger "console;verbosity=minimal" \
              --filter "Category=Sequential"

            duration=$(( $(date +%s) - start ))
            echo "- ✅ Run ${i}: ${duration}s" >> "$GITHUB_STEP_SUMMARY"
            echo "Run ${i}/${ITERATIONS} passed in ${duration}s"
            echo "::endgroup::"
          done
